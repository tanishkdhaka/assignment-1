[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triager"
version = "0.1.0"
requires-python = ">=3.11"
description = "Support Ticket Triager — SDD Assignment Part 1B"
dependencies = [
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
ai = [
    "google-genai>=0.1.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
  "bandit[toml]>=1.8",
  "jsonschema>=4.20.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
